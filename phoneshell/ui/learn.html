<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch and learn</title>
<style>
  :root{
    --bg:#0e1013; --panel:#15181d; --panel2:#1b1f26; --line:#262b33;
    --text:#e7eaf0; --dim:#8b93a1; --accent:#5b8cff; --ok:#3ddc84; --warn:#ffb020; --err:#ff5c5c;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);
         background:var(--panel);min-height:52px;flex-wrap:wrap}
  header .dot{width:8px;height:8px;border-radius:50%;background:#4a515c}
  header .dot.rec{background:var(--err);box-shadow:0 0 8px var(--err);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  header h1{font-size:14px;margin:0;font-weight:600}
  header .meta{color:var(--dim);font-size:12px;font-family:var(--mono)}
  header .spacer{flex:1}
  header a{color:var(--dim);font-size:12px;text-decoration:none}
  header a:hover{color:var(--text)}
  input,button,select{font:inherit;color:var(--text)}
  input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
  button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer}
  button:hover{border-color:#3a424f}
  button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.rec{background:var(--err);border-color:var(--err);color:#fff;font-weight:600}
  button.go{background:var(--ok);border-color:var(--ok);color:#06210f;font-weight:600}
  main{display:grid;grid-template-columns:minmax(300px,400px) 1fr;height:calc(100vh - 52px)}
  #left{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0}
  #screenwrap{flex:1;min-height:200px;display:flex;align-items:center;justify-content:center;padding:16px}
  #phone{border-radius:30px;overflow:hidden;border:2px solid #2b323c;background:#000;display:flex;
         box-shadow:0 20px 60px rgba(0,0,0,.55);transition:border-color .2s}
  #phone.rec{border-color:var(--err)}
  #screen{display:block;max-height:calc(100vh - 250px);max-width:100%;object-fit:contain}
  #bar{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  #bar .row{display:flex;gap:8px}
  #label{flex:1}
  #watch{min-width:120px}
  #why{font-size:12px;color:var(--dim)}
  #why.err{color:var(--err)}
  #right{display:flex;flex-direction:column;min-width:0;min-height:0}
  #tabs{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
  #tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--dim);padding:8px 12px}
  #tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
  .pane{flex:1;min-height:0;overflow:auto;padding:16px 20px;display:none}
  .pane.on{display:block}
  .empty{color:var(--dim);max-width:560px;margin:36px auto}
  .empty ol{color:var(--text)}
  .notes{font-size:12px;color:var(--dim);margin-bottom:12px;max-width:760px}
  .var{border-bottom:1px dashed var(--warn);cursor:help}
  .step{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 12px;
        border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
  .step.off{opacity:.45}
  .step .n{font:12px var(--mono);color:var(--dim);padding-top:2px}
  .step .what{font-weight:600}
  .step .what code{font-family:var(--mono);font-weight:500;color:var(--accent)}
  .step .why{font-size:12px;color:var(--dim)}
  .step .bad{font-size:12px;color:var(--warn)}
  .tag{display:inline-block;font:11px var(--mono);padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
  .tag.ask{background:#3a2a10;color:var(--warn)}
  .tag.ok{background:#12301f;color:var(--ok)}
  .tag.no{background:#3a1414;color:#ffb4b4}
  .thumbs{display:flex;gap:4px}
  .thumbs img{width:44px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
  #savebar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
  #savebar input{flex:1;min-width:160px}
  #inputs{font-size:13px;color:var(--dim);margin-bottom:8px}
  .task{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--panel)}
  .task h3{margin:0 0 2px;font-size:15px}
  .task .d{color:var(--dim);font-size:13px}
  .task .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .task .row input{width:160px}
  .task .res{font-size:13px;margin-top:8px;white-space:pre-wrap}
  .task .res.err{color:var(--err)} .task .res.ok{color:var(--ok)} .task .res.ask{color:var(--warn)}
  #frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
  #frames figure{margin:0;font:11px var(--mono);color:var(--dim)}
  #frames img{width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
  #zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9}
  #zoom img{max-height:94vh;max-width:94vw;border-radius:14px}
  @media (max-width:760px){
    main{grid-template-columns:1fr;height:auto}
    #left{border-right:0;border-bottom:1px solid var(--line)}
    #screen{max-height:60vh}
    .pane{overflow:visible}
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Watch and learn</h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <a href="/">phoneshell</a>
</header>
<main>
  <section id="left">
    <div id="screenwrap"><div id="phone"><img id="screen" src="/stream.mjpeg" alt="Live phone screen"></div></div>
    <div id="bar">
      <div class="row">
        <input id="label" placeholder="What will you do? e.g. order Pad Thai on Grab">
        <button id="watch" class="primary">Watch me</button>
      </div>
      <div id="why">Press Watch me, then do the task on the phone like you normally would. Press Done at the end.</div>
    </div>
  </section>
  <section id="right">
    <div id="tabs">
      <button data-p="steps" class="on">Learned steps</button>
      <button data-p="tasks">Saved tasks</button>
      <button data-p="frames">Screens seen</button>
    </div>
    <div class="pane on" id="p-steps"><div id="steps"></div></div>
    <div class="pane" id="p-tasks"><div id="tasks"></div></div>
    <div class="pane" id="p-frames"><div id="frames"></div></div>
  </section>
</main>
<div id="zoom"><img alt=""></div>
<script>
const $ = s => document.querySelector(s);
let did = null, status = null, draft = null, framesShown = 0, timer = null;

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {'Content-Type': 'application/json'}, ...opts});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tab(p) {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.p === p));
  document.querySelectorAll('.pane').forEach(x => x.classList.toggle('on', x.id === 'p-' + p));
  if (p === 'tasks') loadTasks();
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => tab(b.dataset.p));
function zoom(src) { $('#zoom img').src = src; $('#zoom').style.display = 'flex'; }
$('#zoom').onclick = () => $('#zoom').style.display = 'none';

// An input shows as the value from the demo, marked as something that changes.
const escv = v => esc(v).replace(/\{(\w+)\}/g, (m, k) =>
  draft && draft.inputs && k in draft.inputs
    ? `<span class="var" title="changes each time (${esc(k)})">${esc(draft.inputs[k])}</span>` : m);

function stepText(s) {
  const p = s.params || {};

  switch (s.action) {
    case 'open_app': return `Open <code>${escv(p.name)}</code>`;
    case 'tap': return `Tap <code>${escv(s.target_text)}</code>`;
    case 'type': return `Type <code>${escv(p.text)}</code>${s.target_text ? ` into ${escv(s.target_text)}` : ''}${p.submit ? ' and submit' : ''}`;
    case 'scroll_to': return `Scroll to <code>${escv(p.text)}</code>`;
    case 'press': return `Press ${escv(p.button)}`;
    case 'alert': return `${escv(p.action)} the alert${p.button ? ` (${escv(p.button)})` : ''}`;
    default: return `${escv(s.action)} ${escv(JSON.stringify(p))}`;
  }
}

function renderIdle() {
  $('#steps').innerHTML = `<div class="empty"><b>Teach the phone a task by doing it once.</b><ol>
    <li>Type what you'll do (e.g. <i>order Pad Thai on Grab</i>) and press <b>Watch me</b>.</li>
    <li>Do it on the phone, the normal way. It records every screen you stop on.</li>
    <li>Press <b>Done</b>. Claude works out the steps (about a minute) and checks each one.</li>
    <li>Save it. Next time, press <b>Run</b> here, or ask Claude in the chat: it repeats the task in seconds
        and always stops to ask before paying, ordering or sending.</li></ol></div>`;
}

function renderDraft(d) {
  if (!d || !d.steps) return;
  draft = d;
  const inputs = Object.entries(d.inputs || {});
  $('#steps').innerHTML = `
    ${d.notes ? `<div class="notes">${esc(d.notes)}</div>` : ''}
    ${d.steps.map((s, i) => `
      <div class="step${s.keep === false ? ' off' : ''}" data-i="${i}">
        <input type="checkbox" ${s.keep === false ? '' : 'checked'} title="keep this step">
        <div>
          <div class="what">${i + 1}. ${stepText(s)}
            ${s.confirm ? '<span class="tag ask">asks you first</span>' : ''}
            ${s.verified ? '<span class="tag ok">checked</span>' : '<span class="tag no">unverified</span>'}</div>
          ${s.why ? `<div class="why">${esc(s.why)}</div>` : ''}
          ${(s.checks || []).length ? `<div class="bad">${(s.checks).map(esc).join(' · ')}</div>` : ''}
        </div>
        <div class="thumbs">${[s.from_frame, s.to_frame].filter(Boolean).map(n =>
          `<img src="/api/watch/${did}/frame/${n}" alt="screen ${n}" title="screen ${n}">`).join('')}</div>
      </div>`).join('')}
    <div id="inputs">${inputs.length ? 'Changes each time: ' + inputs.map(([k, v]) => `<b>${esc(k)}</b> (this time: ${esc(v)})`).join(', ') : ''}</div>
    <div id="savebar">
      <input id="mname" value="${esc(d.name || '')}" placeholder="name, e.g. grab-pad-thai">
      <input id="mdesc" value="${esc(d.description || '')}" placeholder="what it does">
      <button id="save" class="primary">${status === 'saved' ? 'Saved ✓ (save again)' : 'Save task'}</button>
    </div>`;
  document.querySelectorAll('.step input').forEach(cb => cb.onchange = e => {
    const i = +e.target.closest('.step').dataset.i;
    draft.steps[i].keep = e.target.checked;
    e.target.closest('.step').classList.toggle('off', !e.target.checked);
  });
  document.querySelectorAll('.thumbs img').forEach(im => im.onclick = () => zoom(im.src));
  $('#save').onclick = async () => {
    try {
      const r = await api(`/api/watch/${did}/save`, {method: 'POST', body: JSON.stringify({
        name: $('#mname').value, description: $('#mdesc').value, steps: draft.steps, inputs: draft.inputs})});
      $('#why').textContent = `Saved as "${r.name}" (${r.steps} steps). Run it from Saved tasks, or ask Claude.`;
      tab('tasks');
    } catch (e) { $('#why').textContent = e.message; $('#why').classList.add('err'); }
  };
}

function renderFrames(frames) {
  const wrap = $('#frames');
  for (const f of frames.slice(framesShown)) {
    const fig = document.createElement('figure');
    fig.innerHTML = `<img loading="lazy" src="/api/watch/${did}/frame/${f.n}" alt="screen ${f.n}"><figcaption>#${f.n} ${esc(f.app)} +${f.t}s</figcaption>`;
    fig.querySelector('img').onclick = e => zoom(e.target.src);
    wrap.appendChild(fig);
  }
  framesShown = frames.length;
}

function setState(s) {
  status = s?.status || null;
  const watching = status === 'watching', learning = status === 'learning';
  $('#dot').classList.toggle('rec', watching);
  $('#phone').classList.toggle('rec', watching);
  const b = $('#watch');
  b.textContent = watching ? 'Done' : learning ? 'Learning…' : 'Watch me';
  b.className = watching ? 'rec' : 'primary';
  b.disabled = learning;
  $('#label').disabled = watching || learning;
  const why = $('#why');
  why.classList.toggle('err', status === 'failed');
  if (watching) why.textContent = `Watching. Do the task on the phone now. ${s.frames} screens so far.`;
  else if (learning) why.textContent = `Working out the steps from ${s.frames} screens (about a minute). You can leave this page.`;
  else if (status === 'failed') why.textContent = 'Could not learn this: ' + s.reason;
  else if (status === 'ready') why.textContent = 'Here is what I learned. Untick anything wrong, name it, and save.';
  $('#meta').textContent = s ? s.label : '';
}

$('#watch').onclick = async () => {
  $('#watch').disabled = true;
  try {
    if (status === 'watching') await api('/api/watch/stop', {method: 'POST', body: '{}'});
    else {
      const r = await api('/api/watch/start', {method: 'POST', body: JSON.stringify({label: $('#label').value})});
      did = r.demo.id; framesShown = 0; $('#frames').innerHTML = ''; draft = null;
      $('#steps').innerHTML = '<div class="empty">Watching. Do the task on the phone.</div>';
      history.replaceState(null, '', '/learn?id=' + did);
    }
  } catch (e) { $('#why').textContent = e.message; $('#why').classList.add('err'); }
  $('#watch').disabled = false;
  poll();
};

async function poll() {
  clearTimeout(timer);
  try {
    if (!did) {
      const h = await api('/api/watches');
      if (h.current && ['watching', 'learning'].includes(h.current.status)) did = h.current.id;
      else { setState(null); renderIdle(); timer = setTimeout(poll, 4000); return; }
    }
    const s = await api(`/api/watch/${did}`);
    setState(s);
    renderFrames(s.frames);
    if (['ready', 'saved'].includes(s.status) && !draft) renderDraft(s.draft);
    if (['watching', 'learning'].includes(s.status)) { timer = setTimeout(poll, 1000); return; }
  } catch (e) { $('#meta').textContent = e.message; }
  timer = setTimeout(poll, 5000);
}

async function loadTasks() {
  const {macros} = await api('/api/macros');
  if (!macros.length) { $('#tasks').innerHTML = '<div class="empty">No saved tasks yet. Teach one with Watch me.</div>'; return; }
  $('#tasks').innerHTML = macros.map(m => `
    <div class="task" data-name="${esc(m.name)}">
      <h3>${esc(m.name)}</h3>
      <div class="d">${esc(m.description)} · ${m.steps} steps · ran ${m.runs}×${m.failures ? `, ${m.failures} stopped early` : ''}
        ${m.confirm_steps.length ? ` · asks before step ${m.confirm_steps.join(', ')}` : ''}</div>
      <div class="row">
        ${Object.entries(m.inputs || {}).map(([k, v]) => `<label>${esc(k)} <input data-k="${esc(k)}" value="${esc(v)}"></label>`).join('')}
        <button class="go run">Run</button>
      </div>
      <div class="res"></div>
    </div>`).join('');
  document.querySelectorAll('.task .run').forEach(b => b.onclick = () => runTask(b.closest('.task')));
}

async function runTask(el, confirmed = false, fromStep = 1) {
  const name = el.dataset.name, res = el.querySelector('.res');
  const inputs = {};
  el.querySelectorAll('input[data-k]').forEach(i => inputs[i.dataset.k] = i.value);
  res.className = 'res'; res.textContent = 'Running…';
  try {
    const {job} = await api(`/api/macro/${encodeURIComponent(name)}/run`, {method: 'POST',
      body: JSON.stringify({inputs, confirmed, from_step: fromStep})});
    let j = job;
    while (j.status === 'running') { await new Promise(r => setTimeout(r, 800)); j = await api(`/api/macro/run/${job.id}`); }
    const took = j.ended ? ` in ${(j.ended - j.started).toFixed(1)}s` : '';
    if (j.status === 'done') { res.className = 'res ok'; res.textContent = `Done${took}.` + (j.log?.length ? '\n' + j.log.join('\n') : ''); }
    else if (j.status === 'paused') {
      res.className = 'res ask';
      res.innerHTML = `${esc(j.message.split('.')[0])}. Check the phone screen.<br><button class="rec yes">Yes, do it</button> <button class="no">Stop here</button>`;
      res.querySelector('.yes').onclick = () => runTask(el, true, j.at_step);
      res.querySelector('.no').onclick = () => { res.className = 'res'; res.textContent = 'Stopped before that step. Nothing was sent or paid.'; };
    } else { res.className = 'res err'; res.textContent = `Stopped at step ${j.at_step ?? '?'}: ${j.message}`; }
  } catch (e) { res.className = 'res err'; res.textContent = e.message; }
}

const q = new URLSearchParams(location.search);
if (q.get('id')) did = q.get('id');
if (q.get('tab')) tab(q.get('tab'));
poll();
</script>
</body>
</html>
